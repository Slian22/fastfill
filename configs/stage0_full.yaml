# Full-parameter SFT on 8x80G (ZeRO-2). Run ONLY after the stage-0 decision
# experiment (LoRA r32 vs r128-all-linear vs full, same 5-10k samples, same
# token budget) shows full-param winning on pre-repair pass + CTR + OOD —
# burden of proof is on full-param / new bases, Qwen3-8B LoRA is the control.
# Launch: accelerate launch --num_processes 8 -m fastfill_train.train_sft \
#           --config configs/sft_full_fp.yaml
model_name_or_path: Qwen/Qwen3-8B
dataset_files: [data/stage0/train.jsonl]
template: direct
output_dir: out/stage0_full
use_lora: false
deepspeed: configs/ds_zero2.json
learning_rate: 1.0e-5
epochs: 2
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
max_seq_length: 2048
warmup_ratio: 0.03
save_steps: 500
eval_steps: 500
val_fraction: 0.05
seed: 43   # snapshot froze heldout with seed 42; same seed here would leave
           # train-time val EMPTY (bucket subset already removed) -> silent eval off
