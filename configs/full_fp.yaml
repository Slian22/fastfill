# Full-data runoff arm A: full-parameter (ZeRO-2). FAIR conditions vs
# configs/full_r128.yaml: same data/full snapshot, same epochs=3, same
# template, same val split — stage-0 gave fp a +1 epoch edge, this is the
# equal-footing rematch that decides the mainline.
# Launch (7 GPUs, leaving GPU 0 for the r128 arm):
#   CUDA_VISIBLE_DEVICES=1,2,3,4,5,6,7 accelerate launch --num_processes 7 \
#     -m fastfill_train.train_sft --config configs/full_fp.yaml
model_name_or_path: Qwen/Qwen3-8B
dataset_files: [data/full/train.jsonl]
template: direct
output_dir: out/full_fp
use_lora: false
deepspeed: configs/ds_zero2.json
learning_rate: 1.0e-5
epochs: 3
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
max_seq_length: 2048
warmup_ratio: 0.03
save_steps: 2000   # > total steps: final save only (ZeRO optim states are huge)
eval_steps: 500
val_fraction: 0.05
seed: 43   # snapshot froze heldout with seed 42; same seed here would leave
           # train-time val EMPTY (bucket subset already removed) -> silent eval off
